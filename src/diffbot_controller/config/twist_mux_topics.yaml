twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      joystick:
        # joy_vel is published by twist_mux's OWN joystick_relay.py node
        # (started automatically by twist_mux_launch.py), which remaps
        # joy_vel_in <- input_joy/cmd_vel and republishes turbo-scaled
        # output on joy_vel_out -> joy_vel. Not a typo — an earlier pass
        # here "fixed" this to input_joy/cmd_vel directly, which was wrong:
        # it would have bypassed turbo scaling and the priority gate.
        topic   : joy_vel
        timeout : 0.5
        priority: 99
      keyboard:
        topic   : key_vel
        timeout : 0.5
        priority: 90
