# controller_manager: the node that owns the ros2_control loop. It reads the
# hardware interface declared in diffbot_ros2_control.xacro and loads the
# controllers listed below on top of it, at the given update_rate.
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    # A Controller (same category as simple_velocity_controller, writes to
    # command_interfaces) that folds two things we had as separate pieces
    # into one: the cmd_vel -> wheel velocity conversion the simple_controller
    # node does by hand, and the command_interfaces write simple_velocity_
    # controller does. It also reads state_interfaces under the hood to
    # integrate odometry (/odom + TF) and enforces velocity/acceleration
    # limits and a cmd_vel timeout, none of which the simple_* path has.
    # Only one of the two paths runs at a time, selected by
    # use_simple_controller in controller.launch.py.
    diffbot_controller:
      type: diff_drive_controller/DiffDriveController

    # Broadcaster: doesn't command anything, just reads state_interfaces
    # (position/velocity) and publishes them on /joint_states, which
    # robot_state_publisher needs to compute TF.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller: writes to command_interfaces. This one takes a target
    # velocity per joint (via topic) and forwards it to the wheels.
    simple_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController


diffbot_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_stamped_vel: true
    left_wheel_names: ['wheel_left_joint']
    right_wheel_names: ['wheel_right_joint']

    publish_rate: 50.0               # default: 50
    pose_covariance_diagonal : [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]

    wheel_separation: 0.1402203698837279
    wheel_radius: 0.033

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Velocity commands timeout [s], default 0.5
    cmd_vel_timeout: 0.5

    # Base frame_id
    base_frame_id: base_footprint #default: base_link

    # Publish limited velocity
    publish_limited_velocity: true

    # Publish wheel data
    publish_wheel_data: true

    # Publish to TF directly or not
    enable_odom_tf: true

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear:
      x:
        has_velocity_limits    : true
        max_velocity           : 1.0  # m/s
        min_velocity           : -0.5 # m/s
        has_acceleration_limits: true
        max_acceleration       : 0.8  # m/s^2
        min_acceleration       : -0.4 # m/s^2
        has_jerk_limits        : false
        max_jerk               : 5.0  # m/s^3
    angular:
      z:
        has_velocity_limits    : true
        max_velocity           : 1.7  # rad/s
        has_acceleration_limits: true
        max_acceleration       : 1.5  # rad/s^2
        has_jerk_limits        : false
        max_jerk               : 2.5  # rad/s^3


# Per-controller parameters, keyed by the controller name defined above.
# "joints" says which of the ros2_control joints this specific controller
# is allowed to command.
simple_velocity_controller:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint